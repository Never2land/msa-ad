[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "msa-ad"
version = "0.2.0"
description = "Measurement System Analysis for Automated-Driving Validation: Gage R&R and seeded-fault coverage verification for simulation, HIL and fault-injection benches."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Linlin Wang" }]
keywords = [
    "measurement-system-analysis",
    "gage-rr",
    "automated-driving",
    "validation",
    "hardware-in-the-loop",
    "fault-injection",
    "functional-safety",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools]
packages = ["msa_ad"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
